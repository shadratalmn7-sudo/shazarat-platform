name: Site integrity audit
on:
  push:
    branches: [production-stabilization, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check site files, links, and JavaScript syntax
        run: node scripts/site-audit.mjs
