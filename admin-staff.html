<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الموظفون والصلاحيات | شذرات</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="nav-universal.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-mobile.css"><link rel="stylesheet" href="admin-operations.css"></head><body data-role="owner"><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/shazarat-logo.svg" alt="شذرات"></a><span class="owner-only">إدارة شذرات</span></div></header><main class="container admin-shell"><aside class="card admin-nav"></aside><section class="admin-main"><div class="admin-title"><div><span class="eyebrow">فريق العمل</span><h1>الموظفون والصلاحيات</h1><p class="muted">هذا القسم يعرض فقط الحسابات التي منحتها أنت رتبة إدارية.</p></div></div><div class="admin-workspace"><div class="admin-toolbar"><div><h2>الموظفون الحاليون</h2><small id="staff-count">جارٍ التحميل…</small></div><input id="staff-search" placeholder="ابحث بين الموظفين"></div><div class="desktop-table-wrap"><table class="live-admin-table"><thead><tr><th>الموظف</th><th>الرتبة</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody id="staff-body"></tbody></table></div></div><div class="admin-workspace" style="margin-top:18px"><div class="admin-toolbar"><div><h2>إضافة موظف من الحسابات المسجلة</h2><small>ابحث بالبريد أو الاسم، ثم اختر الرتبة.</small></div><input id="candidate-search" placeholder="اكتب البريد أو الاسم"></div><div id="candidate-results"></div></div><section class="admin-form-panel" id="staff-editor" hidden style="margin-top:18px"><form id="staff-form"><input type="hidden" name="uid"><div class="admin-form-grid"><label>الاسم<input name="fullName" disabled></label><label>البريد<input name="email" disabled></label><label>الرتبة<select name="role"><option value="student">إ
